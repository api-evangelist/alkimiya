aid: alkimiya
name: Alkimiya
description: >-
  Alkimiya SRL is an Italian digital-health startup headquartered in Rome that builds and
  distributes clinical decision support systems grounded in Evidence Based Medicine. It is
  the exclusive Italian distributor of EBMEDS, a third-generation CDSS owned by Duodecim
  Publication Company of Finland carrying more than 1,000 clinical algorithms for drug
  interaction, contraindication, dosage and medication-reconciliation checking. Alkimiya is
  also developing SmartCare, its own Digital Clinical Decision Pathway platform for the
  proactive support of post-discharge and chronic patients, combining an evidence-based
  knowledge base, a rules engine and an integration API meant to make telemedicine systems
  and electronic health records act on clinical guidance. Continuum of Care packages the
  same pathway engine as cloud SaaS with patient-facing mobile apps. The company markets
  the SmartCare API but publishes no developer portal, reference or machine-readable
  contract.
